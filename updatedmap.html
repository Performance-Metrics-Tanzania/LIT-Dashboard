<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIT Dashboard</title>
  <style>
    body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f4f7fb; color: #111; }
    h1 { margin-top: 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
    .toolbar label { font-size: 0.95rem; }
    select, button { padding: 10px 12px; font: inherit; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
    .status { margin: 16px 0; color: #334; }
    .summary { margin: 20px 0; padding: 16px; background: #fff; border: 1px solid #dde3ec; border-radius: 12px; max-width: 780px; }
    .summary strong { display: inline-block; width: 160px; }
    .table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid #dde3ec; border-radius: 12px; background: #fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #edf2f7; text-align: left; }
    th { background: #f8fafc; position: sticky; top: 0; z-index: 1; }
    .note { margin-top: 12px; color: #555; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>LIT Dashboard</h1>
  <div class="toolbar">
    <button id="reload">Reload workbook</button>
    <label>
      Select sheet:
      <select id="sheetSelect"></select>
    </label>
    <label>
      Or open a local file:
      <input id="fileInput" type="file" accept=".xlsx,.xls" />
    </label>
  </div>
  <div id="status" class="status">Loading workbook...</div>
  <div id="summary" class="summary"></div>
  <div class="table-wrap"><div id="tableContainer"></div></div>
  <p class="note">This page reads <code>LIT schools summary.xlsx</code> from the same folder. If you update the workbook and reload the page, the dashboard will refresh to use the new file.</p>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.19.2/dist/xlsx.full.min.js"></script>
  <script>
    const workbookUrl = 'LIT schools summary.xlsx';
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const sheetSelect = document.getElementById('sheetSelect');
    const tableContainer = document.getElementById('tableContainer');
    const reloadBtn = document.getElementById('reload');
    const fileInput = document.getElementById('fileInput');
    let workbook;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.color = isError ? '#a00' : '#334';
    }

    function arrayToHtmlTable(data) {
      if (!data || data.length === 0) return '<p>No data found.</p>';
      const headerRow = data[0];
      const rows = data.slice(1);
      let html = '<table><thead><tr>' + headerRow.map(cell => `<th>${String(cell || '').replace(/</g, '&lt;')}</th>`).join('') + '</tr></thead><tbody>';
      rows.forEach(row => {
        html += '<tr>' + headerRow.map((_, index) => `<td>${String(row[index] ?? '').replace(/</g, '&lt;')}</td>`).join('') + '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    function renderSummary(sheetName, data) {
      const rowCount = data.length > 1 ? data.length - 1 : 0;
      const colCount = data[0] ? data[0].length : 0;
      summaryEl.innerHTML = `
        <div><strong>Sheet:</strong> ${sheetName}</div>
        <div><strong>Rows:</strong> ${rowCount}</div>
        <div><strong>Columns:</strong> ${colCount}</div>
      `;
    }

    function renderSheet(sheetName) {
      if (!workbook || !sheetName) return;
      const worksheet = workbook.Sheets[sheetName];
      const data = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      renderSummary(sheetName, data);
      tableContainer.innerHTML = arrayToHtmlTable(data.slice(0, 101));
      setStatus(`Loaded sheet "${sheetName}". Displaying first ${Math.min(data.length - 1, 100)} rows.`);
    }

    function populateSheetSelector(sheetNames) {
      sheetSelect.innerHTML = '';
      sheetNames.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        sheetSelect.appendChild(option);
      });
      sheetSelect.onchange = () => renderSheet(sheetSelect.value);
    }

    async function loadWorkbookFromUrl(url) {
      try {
        setStatus('Loading workbook from repository...');
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const arrayBuffer = await response.arrayBuffer();
        workbook = XLSX.read(arrayBuffer, { type: 'array' });
        populateSheetSelector(workbook.SheetNames);
        renderSheet(workbook.SheetNames[0]);
      } catch (error) {
        setStatus(`Unable to load workbook: ${error.message}`, true);
      }
    }

    function loadWorkbookFromFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        workbook = XLSX.read(new Uint8Array(reader.result), { type: 'array' });
        populateSheetSelector(workbook.SheetNames);
        renderSheet(workbook.SheetNames[0]);
      };
      reader.onerror = () => setStatus('Failed to read the selected file.', true);
      reader.readAsArrayBuffer(file);
    }

    reloadBtn.onclick = () => loadWorkbookFromUrl(workbookUrl);
    fileInput.onchange = event => {
      const file = event.target.files[0];
      if (file) loadWorkbookFromFile(file);
    };

    loadWorkbookFromUrl(workbookUrl);
  </script>
</body>
</html>
